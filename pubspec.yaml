name: price_checker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  get: ^4.6.6
  url_launcher: ^6.3.1
  intl: ^0.19.0
  mysql_client: ^0.0.27
  shared_preferences: ^2.3.3
  logger: ^2.5.0
  flutter_barcode_scanner: ^2.0.0
  http: ^1.2.2
  mssql_connection: ^1.1.3
  lottie: ^3.1.3
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  ftpconnect: ^2.0.7
  path_provider: ^2.1.5
  flutter_tts: ^4.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/



  fonts:
    - family: Ojuju
      fonts:
        - asset: assets/fonts/Ojuju-ExtraBold.ttf
          weight: 500

    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-ExtraBoldItalic.ttf
